# DINOv3 边界检测头 V3 训练配置：使用 V2 + patch self-attention 检测头。
data:  # 数据集路径与样本数量设置。
  train_root: data/SAM2_dataset_1024_s512/Train  # 训练集目录，内部应包含 Image/ 和 Instance/。
  val_root: data/SAM2_dataset_1024_s512/Val  # 验证集目录，内部应包含 Image/ 和 Instance/。
  limit_train: null  # 训练集截断数量；null 表示使用全部训练样本。
  limit_val: null  # 验证集截断数量；null 表示使用全部验证样本。
model:  # 模型权重和模型结构配置入口。
  model_config: configs/model/dinov3_sam2.yaml  # DINOv3 与 SAM2 的统一模型配置文件。
output:  # 训练输出目录设置。
  output_dir: outputs/dinov3_boundary_head_v3  # V3 checkpoint、指标、可视化和特征缓存输出目录。
train:  # 优化器和训练轮数设置。
  epochs: 200  # 总训练轮数；resume=true 时会从 last.pt 继续到该轮数。
  batch_size: 16  # 每个 batch 的图像数量。
  num_workers: 2  # DataLoader 后台读取进程数量。
  lr: 0.001  # AdamW 初始学习率。
  weight_decay: 0.0001  # AdamW 权重衰减，降低过拟合。
head:  # 边界检测头结构设置。
  head_type: v3  # V3 使用 ASPP-lite 多尺度卷积加 patch self-attention。
  hidden_channels: 256  # 检测头内部隐藏通道数。
  dropout: 0.1  # 检测头 dropout 比例。
loss:  # boundary 与 foreground 两个任务的损失权重。
  boundary_loss_weight: 1.0  # 边界通道 BCE loss 权重。
  foreground_loss_weight: 0.5  # 前景通道 BCE loss 权重。
  max_pos_weight: 20.0  # 正样本最大平衡权重，避免边界稀疏导致 loss 失衡。
target:  # 从实例 mask 构造 patch 级监督目标的参数。
  target_threshold: 0.05  # soft target 大于该值时视为正样本。
  gt_boundary_dilation: 4  # GT 边界像素膨胀半径，缓解 patch 级边界稀疏问题。
runtime:  # 运行时、缓存和续训设置。
  seed: 42  # 随机种子，保证实验尽量可复现。
  cache_features: true  # 是否缓存冻结 DINOv3 特征，加速后续训练。
  feature_cache_dir: null  # 自定义特征缓存目录；null 时使用 output_dir/feature_cache。
  device: null  # 训练设备；null 时自动使用 cuda 或 cpu。
  resume: true  # 是否从 last.pt 自动续训。
  resume_checkpoint: null  # 指定续训 checkpoint；null 时默认使用 output_dir/checkpoints/last.pt。
  visualize_every: 25  # 每隔多少轮保存一次验证集可视化。
  visualize_samples: 8  # 每次保存的验证可视化样本数量。
